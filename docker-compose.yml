services:
  backend:
    build:
      context: ./backend
    container_name: portfolio-backend
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - ./backend/.env
    environment:
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./frontend
    container_name: portfolio-frontend
    restart: unless-stopped
    mem_limit: 384m
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    ports:
      - '5173:80'
    depends_on:
      - backend
